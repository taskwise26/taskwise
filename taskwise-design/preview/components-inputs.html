<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--color-text); }
  .field .input { font-family: var(--font-body); font-size: 15px; padding: 12px 14px; background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: 12px; color: var(--color-text); transition: all 150ms var(--ease-out); width: 100%; box-sizing: border-box; }
  .field .input::placeholder { color: var(--color-text-faint); }
  .field .input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 4px var(--color-primary-50); }
  .field.focus .input { border-color: var(--color-primary); box-shadow: 0 0 0 4px var(--color-primary-50); }
  .field.error .input { border-color: var(--color-error); }
  .field.error .help { color: var(--color-error); }
  .field .help { font-size: 12px; color: var(--color-text-muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .with-icon { position: relative; }
  .with-icon svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); }
  .with-icon .input { padding-left: 42px; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="field">
      <label>Work email</label>
      <div class="with-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input class="input" placeholder="you@company.com">
      </div>
      <div class="help">We'll never send you marketing without permission.</div>
    </div>
    <div class="field focus">
      <label>Company size</label>
      <input class="input" value="51–200 employees">
      <div class="help">Focused state</div>
    </div>
    <div class="field error">
      <label>Phone</label>
      <input class="input" value="+1 (555)" style="color:var(--color-error)">
      <div class="help">Please enter a valid phone number.</div>
    </div>
    <div class="field">
      <label>Department</label>
      <select class="input" style="appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%238B8DA0%22 stroke-width=%221.75%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22m6 9 6 6 6-6%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:38px">
        <option>Finance</option>
      </select>
      <div class="help">Helps us tailor the demo.</div>
    </div>
  </div>
</div></body></html>
