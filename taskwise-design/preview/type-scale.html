<!doctype html>
<html><head><meta charset="utf-8"><title>Type — scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row-t { display: flex; align-items: baseline; gap: 24px; padding: 8px 0; border-bottom: 1px solid var(--color-divider); }
  .row-t:last-child { border: 0; }
  .row-t .lbl { width: 56px; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
  .row-t .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); margin-left: auto; }
  .row-t .specimen { font-family: var(--font-display); color: var(--color-text); font-weight: 600; letter-spacing: -0.01em; }
</style></head>
<body><div class="card">
  <div class="row-t"><span class="lbl">H1</span><span class="specimen" style="font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-0.02em">Hero headline</span><span class="meta">40 / 600 / -.02</span></div>
  <div class="row-t"><span class="lbl">H2</span><span class="specimen" style="font-size:30px;line-height:1.2;font-weight:600">Section title</span><span class="meta">30 / 600 / -.01</span></div>
  <div class="row-t"><span class="lbl">H3</span><span class="specimen" style="font-size:24px;line-height:1.25;font-weight:600">Subsection</span><span class="meta">24 / 600</span></div>
  <div class="row-t"><span class="lbl">H4</span><span class="specimen" style="font-size:20px;line-height:1.3;font-weight:600">Card heading</span><span class="meta">20 / 600</span></div>
  <div class="row-t"><span class="lbl">H5</span><span class="specimen" style="font-size:18px;font-weight:600">Small heading</span><span class="meta">18 / 600</span></div>
  <div class="row-t"><span class="lbl">H6</span><span class="specimen" style="font-size:16px;font-weight:600">Tertiary label</span><span class="meta">16 / 600</span></div>
</div></body></html>
