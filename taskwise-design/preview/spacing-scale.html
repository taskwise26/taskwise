<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row-s { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
  .row-s .lbl { width: 64px; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
  .row-s .bar { height: 18px; background: var(--color-primary); border-radius: 6px; }
  .row-s .px { font-family: var(--font-mono); font-size: 11px; color: var(--color-text); width: 50px; }
</style></head>
<body><div class="card">
  <div class="row-s"><span class="lbl">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
  <div class="row-s"><span class="lbl">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row-s"><span class="lbl">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
  <div class="row-s"><span class="lbl">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
  <div class="row-s"><span class="lbl">space-5</span><div class="bar" style="width:20px"></div><span class="px">20px</span></div>
  <div class="row-s"><span class="lbl">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
  <div class="row-s"><span class="lbl">space-7</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
  <div class="row-s"><span class="lbl">space-8</span><div class="bar" style="width:40px"></div><span class="px">40px</span></div>
  <div class="row-s"><span class="lbl">space-9</span><div class="bar" style="width:56px"></div><span class="px">56px</span></div>
  <div class="row-s"><span class="lbl">space-10</span><div class="bar" style="width:72px"></div><span class="px">72px</span></div>
  <div class="row-s"><span class="lbl">space-11</span><div class="bar" style="width:96px"></div><span class="px">96px</span></div>
  <div class="row-s"><span class="lbl">space-12</span><div class="bar" style="width:128px"></div><span class="px">128px</span></div>
</div></body></html>
