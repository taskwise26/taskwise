<!doctype html>
<html><head><meta charset="utf-8"><title>Type — pairing</title>
<link rel="stylesheet" href="_card.css">
</head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start">
    <div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px">Display</div>
      <div style="font-family:var(--font-display);font-size:44px;line-height:1.05;letter-spacing:-0.02em;color:var(--color-text);font-weight:500">Bricolage Grotesque</div>
      <div style="font-family:var(--font-display);font-size:14px;color:var(--color-text-muted);margin-top:8px">Soft geometric humanist · Variable · 400 500 600 700</div>
    </div>
    <div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px">Body</div>
      <div style="font-family:var(--font-body);font-size:40px;line-height:1.1;color:var(--color-text);font-weight:500">Manrope</div>
      <div style="font-family:var(--font-body);font-size:14px;color:var(--color-text-muted);margin-top:8px">Rounded humanist · 400 500 600 700</div>
    </div>
  </div>
  <div style="border-top:1px solid var(--color-divider);padding-top:14px;font-size:13px;color:var(--color-text-muted);line-height:1.55">
    Bricolage carries headings with confident, rounded terminals. Manrope keeps body text calm and effortlessly legible. Both share rounded geometry — they cohere.
  </div>
</div></body></html>
